name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          jq --arg v "$VERSION" '.version = $v' extension/manifest.json > tmp.json && mv tmp.json extension/manifest.json
          jq --arg v "$VERSION" '.version = $v' package.json > tmp.json && mv tmp.json package.json

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Verify dist contents
        run: |
          echo "=== dist/ contents ==="
          find extension/dist -type f | sort
          test -f extension/dist/manifest.json || (echo "manifest.json missing" && exit 1)
          test -f extension/dist/background.js  || (echo "background.js missing"  && exit 1)
          test -f extension/dist/content.js     || (echo "content.js missing"     && exit 1)
          test -f extension/dist/options.js     || (echo "options.js missing"     && exit 1)
          test -f extension/dist/options.html   || (echo "options.html missing"   && exit 1)

      - name: Pack extension
        run: |
          cd extension/dist
          zip -r "$GITHUB_WORKSPACE/zombie-sim-${VERSION}.zip" .
          echo "=== zip contents ==="
          unzip -l "$GITHUB_WORKSPACE/zombie-sim-${VERSION}.zip"

      - uses: softprops/action-gh-release@v2
        with:
          name: "v${{ env.VERSION }}"
          files: zombie-sim-${{ env.VERSION }}.zip
          fail_on_unmatched_files: true
          generate_release_notes: true
